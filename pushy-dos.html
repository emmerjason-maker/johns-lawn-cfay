<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Pushy Dos Scoreboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* Legal-pad score sheet (chalkboard in dark mode), read-only, fed by the Google Sheet */
    :root {
      --paper: #FBF5D3; --rule: #B9CDE6; --margin: #E07A7A; --ink: #22303F; --muted: #5E6878; --lead: #DDEFD9;
      --p1: #1F5FAF; --p2: #B23A3A; --p3: #2E7D4F; --p4: #7A4AA6; --p5: #B8640F; --p6: #0F7C86; --p7: #A63A7A; --p8: #5A6B1F;
      --hand: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
      --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1E2A24; --rule: #2F3E36; --margin: #8C4B4B; --ink: #EDEFE6; --muted: #A9B3AA; --lead: #2A3D31;
        --p1: #8FB8F0; --p2: #F09A9A; --p3: #8FD6A8; --p4: #C9A6EE; --p5: #F2B872; --p6: #7FD3DB; --p7: #EE9CCB; --p8: #C3D67F;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.5; }
    .sheet {
      max-width: 40rem; margin: 0 auto; display: grid; gap: 2rem;
      padding-block: 2rem 4rem;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    header { display: grid; gap: 0.25rem; }
    h1 { font-family: var(--hand); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1; margin: 0; }
    h2 { font-family: var(--hand); font-weight: 400; font-size: 1.8rem; margin: 0 0 0.5rem; }
    .sub, .status { margin: 0; color: var(--muted); }
    .status { font-size: 0.9rem; }
    .notice { background: var(--lead); border-radius: 12px; padding: 0.9rem 1rem; }

    .board { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--rule); position: relative; }
    .board::before { content: ""; position: absolute; top: 0; bottom: 0; left: 2.6rem; border-left: 2px solid var(--margin); }
    .row {
      display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 0 0.9rem; align-items: center;
      padding: 0.8rem 0; border-bottom: 2px solid var(--rule);
    }
    .place { font-family: var(--hand); font-size: 1.4rem; color: var(--muted); text-align: center; padding-right: 0.5rem; }
    .who { min-width: 0; display: grid; gap: 0.15rem; padding-left: 0.4rem; }
    .line { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .name { font-family: var(--hand); font-size: 1.7rem; line-height: 1.1; color: var(--c); }
    .count { font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.1rem 0.5rem; border-radius: 999px; border: 1.5px solid var(--c); color: var(--c);
    }
    .streak { color: var(--muted); font-size: 0.9rem; }
    .hot { font-size: 0.85rem; font-weight: 700; color: var(--c); }
    .cold { font-size: 1.1rem; line-height: 1; }
    .tallies { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; min-height: 26px; color: var(--c); }
    .tallies svg { width: 34px; height: 26px; display: block; }
    .tallies .none { font-size: 0.9rem; color: var(--muted); }

    .log { list-style: none; margin: 0; padding: 0; }
    .log li { padding: 0.45rem 0; border-bottom: 1px dashed var(--rule); }
    .log .w { font-weight: 700; color: var(--c); }
    .log .d { color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 420px) {
      .board::before { left: 2rem; }
      .row { grid-template-columns: 2rem minmax(0, 1fr); gap: 0 0.6rem; }
      .name { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <h1>Pushy Dos Scoreboard</h1>
      <p class="sub" id="summary">Loading scores…</p>
      <p class="status" id="status" role="status"></p>
    </header>

    <div class="notice" id="setup" hidden>
      The scoreboard isn't connected to the Google Sheet yet. Paste the sheet's published CSV links into CONFIG at the bottom of this file.
    </div>

    <ol class="board" id="board" aria-label="Standings"></ol>

    <section id="recent" hidden>
      <h2>Recent games</h2>
      <ul class="log" id="log"></ul>
    </section>
  </main>

  <script>
    /* ============================================================
       EDIT THIS BLOCK
       In the Google Sheet: File → Share → Publish to web.
       Pick the tab, choose "Comma-separated values (.csv)", Publish, copy the link.
       Do it once for Standings and once for Games.
       ============================================================ */
    const CONFIG = {
      standingsCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-vsWBYHz5OvMn2UMOYJW2IgcizKY3Opg9MKmyp6wjA_9hTOCndAx4vsJzEf5dbHB37lYX_vIZyJRo/pub?gid=0&single=true&output=csv",
      gamesCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-vsWBYHz5OvMn2UMOYJW2IgcizKY3Opg9MKmyp6wjA_9hTOCndAx4vsJzEf5dbHB37lYX_vIZyJRo/pub?gid=1&single=true&output=csv",            // optional: shows recent games when set
      recentShown: 10,
      refreshSeconds: 60
    };
    /* ============================================================ */

    const COLORS = ["--p1", "--p2", "--p3", "--p4", "--p5", "--p6", "--p7", "--p8"];
    const $ = (id) => document.getElementById(id);

    // Minimal CSV parser (handles quoted fields, commas and newlines inside quotes)
    function parseCsv(text) {
      const rows = []; let row = [], field = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') q = false;
          else field += ch;
        } else if (ch === '"') q = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += ch;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows;
    }
    const num = (v) => { const n = Number(String(v || "").replace(/,/g, "")); return isFinite(n) ? n : 0; };

    function tallySvg(n) {
      let lines = "";
      for (let i = 0; i < Math.min(n, 4); i++) { const x = 5 + i * 7; lines += `<line x1="${x}" y1="3" x2="${x + 1}" y2="23" />`; }
      if (n === 5) lines += `<line x1="1" y1="20" x2="33" y2="6" />`;
      return `<svg viewBox="0 0 34 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">${lines}</svg>`;
    }
    function tallies(n) {
      if (!n) return `<span class="none">No wins yet</span>`;
      let out = "";
      for (let left = Math.min(n, 200); left > 0; left -= 5) out += tallySvg(Math.min(5, left));
      return out;
    }

    async function fetchCsv(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      return parseCsv(await res.text());
    }

    // Streaks from the Games tab, oldest game first (sheet order)
    function computeStreaks(rows) {
      const out = { best: {}, current: null };
      if (!rows || !rows.length) return out;
      const iWin = rows[0].map(h => h.trim().toLowerCase()).indexOf("winner");
      if (iWin < 0) return out;
      let name = null, run = 0;
      for (const r of rows.slice(1)) {
        const w = (r[iWin] || "").trim();
        if (!w) continue;
        run = w === name ? run + 1 : 1;
        name = w;
        out.best[w] = Math.max(out.best[w] || 0, run);
      }
      if (name) out.current = { name, run };
      return out;
    }

    function renderStandings(rows, streaks) {
      const head = rows[0].map(h => h.trim().toLowerCase());
      const iName = head.indexOf("player"), iWins = head.indexOf("wins");
      if (iName < 0 || iWins < 0) throw new Error("columns");
      const players = rows.slice(1)
        .map((r, i) => ({ name: (r[iName] || "").trim(), wins: num(r[iWins]), color: `var(${COLORS[i % COLORS.length]})` }))
        .filter(p => p.name);
      const colorOf = Object.fromEntries(players.map(p => [p.name, p.color]));
      players.sort((a, b) => b.wins - a.wins);

      const top = players.length ? players[0].wins : 0;
      const leaders = players.filter(p => p.wins === top);
      const bottom = players.length ? players[players.length - 1].wins : 0;
      const board = $("board");
      board.innerHTML = "";
      let place = 0, prev = null;
      players.forEach((p, i) => {
        if (p.wins !== prev) { place = i + 1; prev = p.wins; }
        const li = document.createElement("li");
        li.className = "row";
        li.style.setProperty("--c", p.color);
        const best = streaks.best[p.name] || 0;
        const cur = streaks.current && streaks.current.name === p.name ? streaks.current.run : 0;
        const chip = top > 0 && p.wins === top ? `<span class="chip">${leaders.length > 1 ? "Tied" : "Leader"}</span>` : "";
        li.innerHTML = `
          <span class="place" aria-hidden="true">${top > 0 ? place : "–"}</span>
          <div class="who">
            <div class="line">
              <span class="name"></span>
              <span class="count">${p.wins} ${p.wins === 1 ? "win" : "wins"}</span>
              ${chip}
              ${cur ? `<span class="hot">🔥 ${cur} in a row</span>` : ""}
              ${top > bottom && p.wins === bottom ? `<span class="cold" role="img" aria-label="In last place" title="In last place">🥶</span>` : ""}
            </div>
            ${best ? `<div class="streak">Best streak: ${best}</div>` : ""}
            <div class="tallies">${tallies(p.wins)}</div>
          </div>`;
        li.querySelector(".name").textContent = p.name;
        board.appendChild(li);
      });

      const total = players.reduce((s, p) => s + p.wins, 0);
      if (total === 0) $("summary").textContent = "No games yet.";
      else if (leaders.length > 1) $("summary").textContent = `${total} ${total === 1 ? "game" : "games"} played. ${leaders.map(p => p.name).join(", ").replace(/, ([^,]*)$/, " and $1")} are tied at ${top}.`;
      else $("summary").textContent = `${total} ${total === 1 ? "game" : "games"} played. ${leaders[0].name} leads by ${top - (players[1] ? players[1].wins : 0)}.`;
      const c = streaks.current;
      if (total > 0 && c) $("summary").textContent += c.run >= 2 ? ` ${c.name} has won ${c.run} in a row.` : ` ${c.name} won the last game.`;
      return colorOf;
    }

    function renderGames(rows, colorOf) {
      const head = rows[0].map(h => h.trim().toLowerCase());
      const iDate = head.indexOf("date"), iWin = head.indexOf("winner");
      if (iWin < 0) return;
      const games = rows.slice(1).filter(r => (r[iWin] || "").trim()).reverse().slice(0, CONFIG.recentShown);
      const log = $("log");
      log.innerHTML = "";
      for (const r of games) {
        const name = r[iWin].trim();
        const li = document.createElement("li");
        li.style.setProperty("--c", colorOf[name] || "var(--ink)");
        li.innerHTML = `<span class="w"></span> won <span class="d"></span>`;
        li.querySelector(".w").textContent = name;
        li.querySelector(".d").textContent = iDate >= 0 && r[iDate] ? `· ${r[iDate]}` : "";
        log.appendChild(li);
      }
      $("recent").hidden = games.length === 0;
    }

    async function load() {
      if (!CONFIG.standingsCsv) {
        $("setup").hidden = false;
        $("summary").textContent = "Not connected yet.";
        return;
      }
      try {
        const [standings, games] = await Promise.all([
          fetchCsv(CONFIG.standingsCsv),
          CONFIG.gamesCsv ? fetchCsv(CONFIG.gamesCsv).catch(() => null) : null
        ]);
        const colorOf = renderStandings(standings, computeStreaks(games));
        if (games) renderGames(games, colorOf);
        $("status").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}. Sheet changes can take a few minutes to show here.`;
      } catch (e) {
        $("status").textContent = "Couldn't load the scores. Check that the sheet is still published to the web.";
      }
    }

    load();
    setInterval(load, CONFIG.refreshSeconds * 1000);
  </script>
</body>
</html>
