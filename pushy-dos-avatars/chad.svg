  <!-- eye -->
  <ellipse cx="94" cy="36" rx="7" ry="6" fill="#FFFFFF"/>
  <circle cx="96" cy="36" r="3.5" fill="#22303F"/><circle cx="97" cy="35" r="1.2" fill="#FFFFFF"/>
  <path d="M86 28 Q94 24 102 30" stroke="#1F6B47" stroke-width="2.5" fill="none" stroke-linecap="round"/>
