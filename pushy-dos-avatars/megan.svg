<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#DDEFD9"/>
  <!-- ground -->
  <path d="M0 100 H128" stroke="#9BBF8F" stroke-width="3"/>
  <!-- spare tire on the back -->
  <circle cx="17" cy="66" r="11" fill="#22303F"/><circle cx="17" cy="66" r="5" fill="#9AA5B1"/>
  <!-- boxy body -->
  <rect x="22" y="56" width="90" height="30" rx="5" fill="#E6A817"/>
  <!-- cabin -->
  <path d="M30 56 V36 Q30 32 34 32 H84 Q88 32 90 36 L100 56 Z" fill="#E6A817"/>
  <!-- windows -->
  <rect x="35" y="37" width="22" height="16" rx="2" fill="#BFE3F2"/>
  <rect x="61" y="37" width="20" height="16" rx="2" fill="#BFE3F2"/>
  <path d="M85 37 L95 53 H85 Z" fill="#BFE3F2"/>
  <!-- roof rack -->
  <path d="M34 28 H86" stroke="#22303F" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 28 V32 M60 28 V32 M80 28 V32" stroke="#22303F" stroke-width="2.5"/>
  <!-- door line + handle -->
  <path d="M59 56 V82" stroke="#B9830C" stroke-width="2"/>
  <rect x="62" y="60" width="8" height="2.5" rx="1" fill="#7A560A"/>
  <!-- front: round headlight + grille slots -->
  <rect x="104" y="58" width="12" height="22" rx="3" fill="#3A4A63"/>
  <circle cx="110" cy="63" r="4" fill="#FFF3B0" stroke="#22303F" stroke-width="1.5"/>
  <path d="M106 70 H114 M106 73 H114 M106 76 H114" stroke="#9AA5B1" stroke-width="1.5"/>
  <!-- black fender flares + bumper -->
  <path d="M26 86 Q38 72 50 86 Z" fill="#22303F"/>
  <path d="M84 86 Q96 72 108 86 Z" fill="#22303F"/>
  <rect x="104" y="82" width="16" height="6" rx="2" fill="#22303F"/>
  <!-- wheels -->
  <circle cx="38" cy="88" r="12" fill="#22303F"/><circle cx="38" cy="88" r="5.5" fill="#C9CED6"/>
  <circle cx="96" cy="88" r="12" fill="#22303F"/><circle cx="96" cy="88" r="5.5" fill="#C9CED6"/>
  <!-- mud specks -->
  <g fill="#8A6A3B"><circle cx="50" cy="96" r="1.6"/><circle cx="56" cy="93" r="1.2"/><circle cx="108" cy="96" r="1.4"/></g>
</svg>
