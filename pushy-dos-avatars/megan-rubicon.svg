<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#E3D9C6"/>
  <!-- rocks / trail -->
  <path d="M0 104 Q20 96 40 102 T80 100 T128 104 V128 H0 Z" fill="#B59C79"/>
  <path d="M6 104 q6 -8 14 0 z M98 102 q8 -10 16 0 z" fill="#8F7A5C"/>
  <!-- spare tire -->
  <circle cx="15" cy="62" r="12" fill="#22303F"/><circle cx="15" cy="62" r="5" fill="#6B7280"/>
  <!-- body (white) -->
  <rect x="22" y="54" width="92" height="30" rx="4" fill="#F7F7F5" stroke="#9AA5B1" stroke-width="2"/>
  <!-- soft top / cabin -->
  <path d="M30 54 V30 H92 L98 54 Z" fill="#F7F7F5" stroke="#9AA5B1" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 30 H94" stroke="#22303F" stroke-width="4" stroke-linecap="round"/>
  <!-- windows -->
  <rect x="35" y="35" width="24" height="16" rx="2" fill="#9FC9DE"/>
  <rect x="63" y="35" width="22" height="16" rx="2" fill="#9FC9DE"/>
  <path d="M89 35 L94 51 H89 Z" fill="#9FC9DE"/>
  <!-- door seam + hinge -->
  <path d="M61 54 V80" stroke="#C3C8CF" stroke-width="2"/>
  <rect x="88" y="58" width="5" height="3" rx="1" fill="#22303F"/><rect x="88" y="72" width="5" height="3" rx="1" fill="#22303F"/>
  <!-- hood side vent decal -->
  <path d="M96 60 h10 M96 64 h10" stroke="#22303F" stroke-width="2" stroke-linecap="round"/>
  <!-- front: grille + round headlight -->
  <rect x="108" y="56" width="10" height="26" rx="2" fill="#E9EAEC" stroke="#9AA5B1" stroke-width="1.5"/>
  <circle cx="113" cy="62" r="3.6" fill="#FFF3B0" stroke="#22303F" stroke-width="1.3"/>
  <path d="M110 68 V78 M113 68 V78 M116 68 V78" stroke="#22303F" stroke-width="1.6"/>
  <!-- black fender flares, rock rails, bumper -->
  <path d="M24 84 Q38 64 54 84 Z" fill="#22303F"/>
  <path d="M84 84 Q98 64 114 84 Z" fill="#22303F"/>
  <rect x="52" y="82" width="34" height="5" rx="2" fill="#22303F"/>
  <rect x="106" y="80" width="18" height="7" rx="2" fill="#22303F"/>
  <!-- big off-road tires -->
  <circle cx="39" cy="88" r="14" fill="#1A1E25"/><circle cx="39" cy="88" r="6" fill="#9AA5B1"/>
  <circle cx="99" cy="88" r="14" fill="#1A1E25"/><circle cx="99" cy="88" r="6" fill="#9AA5B1"/>
  <g stroke="#3A404A" stroke-width="2"><path d="M27 82 l4 2 M27 94 l4 -2 M51 82 l-4 2 M51 94 l-4 -2"/><path d="M87 82 l4 2 M87 94 l4 -2 M111 82 l-4 2 M111 94 l-4 -2"/></g>
</svg>
